    body {
      touch-action: manipulation;
      background-color: #121118;
      background-image:

      background-position: 0 0, 12px 12px;
    }

      width: 6px;
      height: 6px;
    }

    }

      background: #ff007f;
      border-radius: 9999px;
    }

    .felt-patch {
      background-color: #1e1b2e;
      border: 3px dashed #7a5ba8;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5), inset 0 0 12px rgba(255, 0, 127, 0.1);

    .felt-patch-owned {
      border: 3px solid #39ff14;
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.3), inset 0 0 15px rgba(57, 255, 20, 0.15);
    }

    /* Print styles for adoption certificate */
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      body * {
        visibility: hidden;
      }
      #print-certificate-container, #print-certificate-container * {
        visibility: visible;
      }
      #print-certificate-container {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 24px;
        background: white !important;
        color: black !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        z-index: 99999;
      }
    }

    // Main Interactive SVG Avatar
    function MonsterAvatar({ monster, size = 'md', interactive = true, onChomp, className = '' }) {
      const [isBiting, setIsBiting] = useState(false);
      const [showRear, setShowRear] = useState(false);

      const handleClick = (e) => {
        if (!interactive) return;
        e.stopPropagation();
        setIsBiting(true);
        if (onChomp) onChomp();
        setTimeout(() => setIsBiting(false), 240);
      };

      const dimensions = {
        sm: 'w-16 h-16',
        md: 'w-32 h-32',
        lg: 'w-48 h-48 sm:w-56 sm:h-56',
        xl: 'w-64 h-64 sm:w-72 sm:h-72',
      }[size] || 'w-32 h-32';

      const isGold = monster.svgConfig?.hasGoldButton || monster.rarity === 'Golden BUTT-on';

      if (showRear) {
        return (
          <div
            onClick={() => setShowRear(false)}
            className={`relative ${dimensions} rounded-2xl bg-[#1e1b2e] border-2 border-dashed border-purple-500/50 flex flex-col items-center justify-center p-3 cursor-pointer group select-none ${className}`}
            title="Official Fuggler Rear Signature BUTT-on (Click to flip front)"
          >
            <div className="text-center mb-1">
              <p className="text-[10px] font-mono uppercase tracking-wider text-[#ff007f] font-bold">Official Rear Mark</p>
              <p className="text-[9px] text-zinc-400">Signature BUTT-on</p>
            </div>
            <div
              className={`relative w-14 h-14 rounded-full flex items-center justify-center shadow-lg transition-transform group-hover:scale-110 ${
                isGold
                  ? 'bg-gradient-to-tr from-amber-500 via-yellow-300 to-amber-600 border-2 border-amber-200 shadow-amber-500/40 ring-4 ring-amber-400/20'
                  : 'bg-[#27272a] border-2 border-[#52525b] shadow-black/60'
              }`}
            >
              <div className="grid grid-cols-2 gap-2">
                <span className="w-2 h-2 rounded-full bg-black/80" />
                <span className="w-2 h-2 rounded-full bg-black/80" />
                <span className="w-2 h-2 rounded-full bg-black/80" />
                <span className="w-2 h-2 rounded-full bg-black/80" />
              </div>
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <span className={`w-4 h-0.5 rotate-45 ${isGold ? 'bg-amber-900' : 'bg-pink-400'}`} />
                <span className={`w-4 h-0.5 -rotate-45 ${isGold ? 'bg-amber-900' : 'bg-pink-400'}`} />
              </div>
            </div>
            <p className="mt-2 text-[10px] font-mono text-zinc-400 group-hover:text-[#39ff14] transition-colors">↺ Tap to flip front</p>
          </div>
        );
      }

      const { bodyColor, eyeColorLeft, eyeColorRight, eyeStyle, earsStyle, mouthStyle, stitchColor, accessory } = monster.svgConfig || {
        bodyColor: '#a855f7',
        eyeColorLeft: '#ef4444',
        eyeColorRight: '#18181b',
        eyeStyle: 'buttons',
        earsStyle: 'bunny',
        mouthStyle: 'wide-dentures',
        stitchColor: '#4c1d95',
        accessory: 'none'
      };

      return (
        <div
          onClick={handleClick}
          className={`relative ${dimensions} cursor-pointer group select-none transition-transform duration-150 active:scale-95 ${className}`}
          title={`${monster.name} - Click to bite!`}
        >
          <svg viewBox="0 0 200 200" className={`w-full h-full filter drop-shadow-[0_10px_16px_rgba(0,0,0,0.6)] transition-transform duration-200 group-hover:scale-105 ${isBiting ? 'scale-95' : ''}`}>
            {/* Ears / Horns */}
            {earsStyle === 'bunny' && (
              <g>
                <path d="M 60 55 C 40 5, 20 20, 50 65" fill={bodyColor} stroke={stitchColor} strokeWidth="3" strokeDasharray="4,3" />
                <path d="M 140 55 C 160 5, 180 20, 150 65" fill={bodyColor} stroke={stitchColor} strokeWidth="3" strokeDasharray="4,3" />
                <path d="M 52 50 C 42 22, 32 30, 48 58" fill="#fda4af" opacity="0.6" />
                <path d="M 148 50 C 158 22, 168 30, 152 58" fill="#fda4af" opacity="0.6" />
              </g>
            )}
            {earsStyle === 'horns' && (
              <g>
                <path d="M 55 58 C 30 25, 45 10, 68 45 Z" fill="#fbbf24" stroke="#b45309" strokeWidth="2.5" />
                <path d="M 145 58 C 170 25, 155 10, 132 45 Z" fill="#fbbf24" stroke="#b45309" strokeWidth="2.5" />
              </g>
            )}
            {earsStyle === 'bat' && (
              <g>
                <polygon points="45,55 20,20 65,42" fill={bodyColor} stroke={stitchColor} strokeWidth="3" />
                <polygon points="155,55 180,20 135,42" fill={bodyColor} stroke={stitchColor} strokeWidth="3" />
              </g>
            )}
            {earsStyle === 'bear' && (
              <g>
                <circle cx="50" cy="48" r="20" fill={bodyColor} stroke={stitchColor} strokeWidth="3" strokeDasharray="4,3" />
                <circle cx="50" cy="48" r="10" fill="#fca5a5" opacity="0.4" />
                <circle cx="150" cy="48" r="20" fill={bodyColor} stroke={stitchColor} strokeWidth="3" strokeDasharray="4,3" />
                <circle cx="150" cy="48" r="10" fill="#fca5a5" opacity="0.4" />
              </g>
            )}
            {earsStyle === 'alien' && (
              <g>
                <line x1="100" y1="45" x2="100" y2="18" stroke={stitchColor} strokeWidth="4" />
                <circle cx="100" cy="15" r="9" fill="#39ff14" stroke="#047857" strokeWidth="2" />

            {/* Main Plush Body */}

                  <line x1="-4" y1="4" x2="4" y2="-4" stroke="#ffffff" strokeWidth="1.2" />

                <g transform="translate(132, 85)">
                  {eyeStyle === 'googly' ? (
                    <g>
                      <circle cx="0" cy="0" r="16" fill="#f8fafc" stroke="#334155" strokeWidth="2" />
                      <circle cx="3" cy="2" r="8" fill="#0f172a" />

                      <circle cx="0" cy="0" r="10" fill="none" stroke="rgba(0,0,0,0.3)" strokeWidth="1" />
                      <circle cx="-3" cy="-3" r="1.4" fill="#09090b" />
                      <circle cx="3" cy="-3" r="1.4" fill="#09090b" />
                      <circle cx="-3" cy="3" r="1.4" fill="#09090b" />
                      <circle cx="3" cy="3" r="1.4" fill="#09090b" />
                      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#f43f5e" strokeWidth="1.2" />
                      <line x1="-3" y1="3" x2="3" y2="-3" stroke="#f43f5e" strokeWidth="1.2" />
                    </g>
                  )}
                </g>
              </g>

            {/* Nose stitches */}
            <g transform="translate(100, 106)">
              <line x1="-4" y1="-4" x2="4" y2="4" stroke={stitchColor} strokeWidth="2.5" />
              <line x1="-4" y1="4" x2="4" y2="-4" stroke={stitchColor} strokeWidth="2.5" />
            </g>

            {/* HUMAN TEETH MOUTH */}
            <g transform={`translate(0, ${isBiting ? -4 : 0})`}>
              <path d="M 55 125 C 55 118, 145 118, 145 125 C 148 152, 52 152, 55 125 Z" fill="#450a0a" stroke="#1c1917" strokeWidth="3" />
              <path d="M 58 123 C 75 120, 125 120, 142 123 C 140 128, 60 128, 58 123 Z" fill="#e11d48" />

              {/* Upper Teeth */}
              {mouthStyle === 'golden-teeth' ? (
                <g fill="#fbbf24" stroke="#b45309" strokeWidth="1">
                  <rect x="62" y="124" width="10" height="11" rx="2" />
                  <rect x="74" y="124" width="12" height="13" rx="2" />
                  <rect x="88" y="124" width="12" height="13" rx="2" />
                  <rect x="102" y="124" width="12" height="13" rx="2" />
                  <rect x="116" y="124" width="12" height="13" rx="2" />
                  <rect x="130" y="124" width="10" height="11" rx="2" />
                </g>
              ) : mouthStyle === 'fangs' ? (
                <g fill="#fbf8eb" stroke="#d6d3d1" strokeWidth="1">
                  <rect x="62" y="124" width="11" height="9" rx="1.5" />
                  <polygon points="75,124 86,124 81,142" fill="#ffffff" stroke="#e7e5e4" />
                  <rect x="88" y="124" width="11" height="9" rx="1.5" />
                  <rect x="101" y="124" width="11" height="9" rx="1.5" />
                  <polygon points="114,124 125,124 120,142" fill="#ffffff" stroke="#e7e5e4" />
                  <rect x="127" y="124" width="11" height="9" rx="1.5" />
                </g>
              ) : mouthStyle === 'snaggle-gap' ? (
                <g fill="#fbf8eb" stroke="#a8a29e" strokeWidth="1">
                  <rect x="60" y="124" width="11" height="10" rx="2" />
                  <rect x="73" y="124" width="12" height="12" rx="2" />
                  <rect x="115" y="124" width="12" height="12" rx="2" />
                  <rect x="129" y="124" width="11" height="10" rx="2" />
                </g>
              ) : (
                <g fill="#fbf8eb" stroke="#78716c" strokeWidth="0.8">
                  <rect x="61" y="124" width="9" height="10" rx="1.5" />
                  <rect x="72" y="124" width="11" height="12" rx="1.5" />
                  <rect x="85" y="124" width="13" height="13" rx="1.5" />
                  <rect x="100" y="124" width="13" height="13" rx="1.5" />
                  <rect x="115" y="124" width="11" height="12" rx="1.5" />
                  <rect x="128" y="124" width="9" height="10" rx="1.5" />
                </g>
              )}

              {/* Lower Teeth */}
              <g transform={`translate(0, ${isBiting ? -6 : 0})`}>
                <path d="M 64 148 C 80 152, 120 152, 136 148 C 135 142, 65 142, 64 148 Z" fill="#e11d48" />
                <g fill={mouthStyle === 'golden-teeth' ? '#fbbf24' : '#fbf8eb'} stroke={mouthStyle === 'golden-teeth' ? '#b45309' : '#78716c'} strokeWidth="0.8">
                  <rect x="67" y="137" width="9" height="9" rx="1.5" />
                  <rect x="78" y="136" width="10" height="11" rx="1.5" />
                  <rect x="90" y="135" width="10" height="12" rx="1.5" />
                  <rect x="102" y="135" width="10" height="12" rx="1.5" />
                  <rect x="114" y="136" width="10" height="11" rx="1.5" />
                  <rect x="126" y="137" width="8" height="9" rx="1.5" />
                </g>
              </g>

              {accessory === 'drool' && (
                <path d="M 125 142 C 125 152, 123 158, 124 162 C 126 164, 128 162, 127 156 Z" fill="#38bdf8" opacity="0.85" />
              )}
            </g>
          </svg>

          {isBiting && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <span className="text-xl sm:text-2xl font-black text-[#ffe600] drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] rotate-[-8deg]">
                CHOMP! 🦷
              </span>
            </div>
          )}

          <button
            type="button"
            onClick={(e) => {
              e.stopPropagation();
              setShowRear(true);
            }}
            className="absolute bottom-1 right-1 px-1.5 py-0.5 rounded bg-black/75 hover:bg-black text-[9px] font-mono text-zinc-300 border border-purple-500/40"
            title="Inspect signature BUTT-on"
          >
            {isGold ? '🟡 BUTT-on' : '🪡 BUTT-on'}
          </button>
        </div>
      );
    }

    // App Component
    function App() {
      const [activeTab, setActiveTab] = useState('vault');
      const [monsters, setMonsters] = useState(() => {
        try {
          const saved = localStorage.getItem('fuggler_all_monsters_v3');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const customOnly = parsed.filter(m => m.isCustom);
              return [...INITIAL_MONSTERS, ...customOnly];
            }
          }
        } catch(e) {}
        return INITIAL_MONSTERS;
      });

      const [ownedIds, setOwnedIds] = useState(() => {
        try {
          const saved = localStorage.getItem('fuggler_vault_owned');
          if (saved) return new Set(JSON.parse(saved));
        } catch(e) {}
        return new Set(['fuggler-rabid-rabbit', 'fuggler-gaptooth-mcgruff', 'fuggler-sir-horns-a-lot', 'fuggler-mr-buttons']);
      });

      const [selectedMonster, setSelectedMonster] = useState(INITIAL_MONSTERS[0]);
      const [filters, setFilters] = useState({
        search: '',
        series: 'all',
        status: 'all',
      });

      // Adoption Studio State
      const [adopterName, setAdopterName] = useState('Stephen');
      const [monsterAlias, setMonsterAlias] = useState(INITIAL_MONSTERS[0].name);
      const [residence, setResidence] = useState('Under the Bed');
      const [serialCode, setSerialCode] = useState(`FUG-${Math.floor(100000 + Math.random() * 900000)}-MISFIT`);
      const [pledge1, setPledge1] = useState(true);
      const [pledge2, setPledge2] = useState(true);
      const [adoptedToday, setAdoptedToday] = useState(false);

      // Monster Lab ("Build A Fuggler") State
      const [labName, setLabName] = useState('Snaggle-Bite Bob');
      const [labSpecies, setLabSpecies] = useState('Chompulus Weirdicus');
      const [labMischief, setLabMischief] = useState('Unplugs phone chargers right before your alarm rings');
      const [labColorIndex, setLabColorIndex] = useState(0);
      const [labPattern, setLabPattern] = useState('quilted');
      const [labMouth, setLabMouth] = useState('snaggle-gap');
      const [labEyeStyle, setLabEyeStyle] = useState('mismatched');
      const [labEyeLeft, setLabEyeLeft] = useState('#ef4444');
      const [labEyeRight, setLabEyeRight] = useState('#fbbf24');
      const [labEars, setLabEars] = useState('horns');
      const [labAccessory, setLabAccessory] = useState('drool');
      const [labHasGold, setLabHasGold] = useState(false);
      const [labTeethCount, setLabTeethCount] = useState(26);

      // Teeth Clinic State
      const [clinicTeeth, setClinicTeeth] = useState(() => {
        return Array.from({ length: 28 }).map((_, i) => ({ id: i, isCleaned: false, isGold: false }));
      });

      // Save to localStorage
      useEffect(() => {
        try {
          localStorage.setItem('fuggler_vault_owned', JSON.stringify(Array.from(ownedIds)));
        } catch(e) {}
      }, [ownedIds]);

      useEffect(() => {
        try {
          localStorage.setItem('fuggler_all_monsters_v3', JSON.stringify(monsters));
        } catch(e) {}
      }, [monsters]);

      const toggleOwned = (id) => {
        setOwnedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      const handleRescueRandom = () => {
        const unowned = monsters.filter(m => !ownedIds.has(m.id));
        const candidate = unowned.length > 0
          ? unowned[Math.floor(Math.random() * unowned.length)]
          : monsters[Math.floor(Math.random() * monsters.length)];
        setSelectedMonster(candidate);
        setMonsterAlias(candidate.name);
        setActiveTab('adoption');
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.5 }, colors: ['#ffe600', '#ff007f'] });
      };

      const handleRandomizeLab = () => {
        setLabColorIndex(Math.floor(Math.random() * COLOR_PALETTES.length));
        setLabPattern(['plain', 'quilted', 'spots', 'burlap'][Math.floor(Math.random() * 4)]);
        setLabMouth(['wide-dentures', 'snaggle-gap', 'fangs', 'golden-teeth'][Math.floor(Math.random() * 4)]);
        setLabEyeStyle(['buttons', 'googly', 'mismatched', 'cyclops'][Math.floor(Math.random() * 4)]);
        setLabEyeLeft(EYE_COLORS[Math.floor(Math.random() * EYE_COLORS.length)]);
        setLabEyeRight(EYE_COLORS[Math.floor(Math.random() * EYE_COLORS.length)]);
        setLabEars(['bunny', 'horns', 'bear', 'alien', 'bat', 'none'][Math.floor(Math.random() * 6)]);
        setLabAccessory(['patch', 'bandage', 'drool', 'monocle', 'none'][Math.floor(Math.random() * 5)]);
        setLabHasGold(Math.random() > 0.6);
        setLabTeethCount(Math.floor(18 + Math.random() * 18));

        const names = ['Barnaby Bite', 'Sir Gaptooth', 'Grumpy Gill', 'Molar Max', 'Stitches McGee', 'Tooth Fairy Terror'];
        const crimes = [
          'Licks all the icing off cupcakes when no one is looking',
          'Rearranges refrigerator magnets into cryptic threats',
          'Chews TV remote volume buttons off',
          'Hides car keys inside cereal boxes'
        ];
        setLabName(names[Math.floor(Math.random() * names.length)]);
        setLabMischief(crimes[Math.floor(Math.random() * crimes.length)]);
      };

      // Filtered Monsters
      const filteredMonsters = useMemo(() => {
        return monsters.filter(m => {
          if (filters.search) {
            const q = filters.search.toLowerCase();
            if (!m.name.toLowerCase().includes(q) && !m.species.toLowerCase().includes(q) && !m.mischiefTrait.toLowerCase().includes(q)) {
              return false;
            }
          }
          if (filters.series !== 'all' && m.series !== filters.series) return false;
          const isOwned = ownedIds.has(m.id);
          if (filters.status === 'owned' && !isOwned) return false;
          if (filters.status === 'unowned' && isOwned) return false;
          return true;
        });
      }, [monsters, filters, ownedIds]);

      return (
        <div className="min-h-screen h-full flex flex-col bg-[#121118] text-zinc-100 font-sans">
          {/* Header */}
          <header className="flex items-center justify-between px-4 sm:px-8 py-3.5 bg-[#121118]/95 backdrop-blur-md border-b border-[#4c3875]/40 shrink-0 sticky top-0 z-40">
            <a href="#" onClick={(e) => { e.preventDefault(); setActiveTab('vault'); }} className="text-lg sm:text-xl font-black text-[#ffe600] hover:text-[#ff007f] transition-colors flex items-center gap-2">
              <span>🦷 Fuggler Vault</span>
            </a>

            <nav className="hidden md:flex items-center gap-6 lg:gap-8 text-sm font-medium">
              <button type="button" onClick={() => setActiveTab('vault')} className={`py-1 ${activeTab === 'vault' ? 'text-[#39ff14] font-semibold border-b-2 border-[#39ff14]' : 'text-zinc-400 hover:text-white'}`}>
                Collection Vault ({monsters.length})
              </button>
              <button type="button" onClick={() => setActiveTab('lab')} className={`py-1 ${activeTab === 'lab' ? 'text-[#ffe600] font-semibold border-b-2 border-[#ffe600]' : 'text-zinc-400 hover:text-white'}`}>
                Build-A-Fuggler (Lab)
              </button>
              <button type="button" onClick={() => setActiveTab('adoption')} className={`py-1 ${activeTab === 'adoption' ? 'text-[#ff007f] font-semibold border-b-2 border-[#ff007f]' : 'text-zinc-400 hover:text-white'}`}>
                Adoption Studio
              </button>
              <button type="button" onClick={() => setActiveTab('guide')} className={`py-1 ${activeTab === 'guide' ? 'text-[#a855f7] font-semibold border-b-2 border-[#a855f7]' : 'text-zinc-400 hover:text-white'}`}>
                Field Guide & Codex
              </button>
              <button type="button" onClick={() => setActiveTab('clinic')} className={`py-1 ${activeTab === 'clinic' ? 'text-cyan-400 font-semibold border-b-2 border-cyan-400' : 'text-zinc-400 hover:text-white'}`}>
                Teeth Clinic
              </button>
            </nav>

            <div className="flex items-center gap-3">
              <button
                type="button"
                onClick={() => setActiveTab('lab')}
                className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#ff007f] hover:bg-[#d6006b] text-white text-xs font-bold shadow-md transition-transform active:scale-95"
              >
                <span>✂️ Build Fuggler</span>
              </button>
              <button type="button" onClick={handleRescueRandom} className="flex items-center gap-1.5 px-3 sm:px-4 py-2 text-xs font-bold text-black bg-[#ffe600] hover:bg-[#ffd000] rounded-lg shadow-md active:scale-95">
                <span>✨ Rescue Misfit</span>
              </button>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 flex flex-col overflow-hidden pb-14 md:pb-0">
            {/* VAULT VIEW */}
            {activeTab === 'vault' && (
              <div className="flex-1 overflow-y-auto custom-scrollbar px-4 sm:px-8 py-6 space-y-6">
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-[#4c3875]/40 pb-5">
                  <div>
                    <h1 className="text-2xl sm:text-3xl font-black text-white flex items-center gap-3">
                      <span>Funny Ugly Monster Registry</span>
                      <span className="text-xs px-2 py-0.5 rounded bg-[#ff007f]/20 border border-[#ff007f] text-[#ff007f] font-mono">
                        {monsters.length} Registered
                      </span>
                    </h1>
                    <div className="flex flex-wrap items-center gap-2 text-xs sm:text-sm text-zinc-400 mt-2 font-mono">
                      <span>In Your Vault: <strong className="text-[#39ff14]">{ownedIds.size}</strong></span>
                      <span>·</span>
                      <span>Teeth Counted: <strong className="text-[#ffe600]">{monsters.filter(m => ownedIds.has(m.id)).reduce((a,c) => a + c.teethCount, 0)}</strong></span>
                      <span>·</span>
                      <span>Golden BUTT-ons: <strong className="text-amber-400">{monsters.filter(m => ownedIds.has(m.id) && m.svgConfig?.hasGoldButton).length}</strong></span>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => setActiveTab('lab')}
                    className="flex items-center gap-2 px-4 py-2.5 bg-[#ff007f] hover:bg-[#d6006b] text-white text-xs font-bold rounded-lg shadow-lg active:scale-95"
                  >
                    <span>✂️ Stitch Custom Fuggler</span>
                  </button>
                </div>

                {/* Filter bar */}
                <div className="bg-[#1e1b2e] border border-[#4c3875]/50 rounded-xl p-4 space-y-3">
                  <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    <input
                      type="text"
                      placeholder="Search monsters by name, trait, or species..."
                      value={filters.search}
                      onChange={(e) => setFilters(f => ({ ...f, search: e.target.value }))}
                      className="flex-1 bg-[#121118] border border-[#4c3875]/60 rounded-lg px-3 py-2 text-xs sm:text-sm text-zinc-100 focus:outline-none focus:border-[#ff007f]"
                    />
                    <div className="flex items-center p-1 bg-[#121118] rounded-lg border border-[#4c3875]/60 text-xs">
                      <button onClick={() => setFilters(f => ({ ...f, status: 'all' }))} className={`px-2.5 py-1 rounded ${filters.status === 'all' ? 'bg-[#4c3875] text-white font-bold' : 'text-zinc-400'}`}>All</button>
                      <button onClick={() => setFilters(f => ({ ...f, status: 'owned' }))} className={`px-2.5 py-1 rounded ${filters.status === 'owned' ? 'bg-[#39ff14] text-black font-bold' : 'text-zinc-400'}`}>In Vault</button>
                      <button onClick={() => setFilters(f => ({ ...f, status: 'unowned' }))} className={`px-2.5 py-1 rounded ${filters.status === 'unowned' ? 'bg-[#ff007f] text-white font-bold' : 'text-zinc-400'}`}>Wild</button>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                    {['all', 'Series 1', 'Series 2', 'Series 3', 'Lab Misfits', 'Snuggler Edition', 'Fart Faces', 'Gold Chase', 'Glow In The Dark', 'Custom Creations'].map(s => (
                      <button key={s} onClick={() => setFilters(f => ({ ...f, series: s }))} className={`px-3 py-1 rounded-md whitespace-nowrap ${filters.series === s ? 'bg-[#ff007f]/20 border border-[#ff007f] text-[#ff007f] font-bold' : 'bg-[#121118] text-zinc-400'}`}>
                        {s === 'all' ? 'All Series' : s}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {filteredMonsters.map(monster => {
                    const isOwned = ownedIds.has(monster.id);
                    return (
                      <div key={monster.id} className={`rounded-2xl p-4 flex flex-col justify-between transition-all ${isOwned ? 'felt-patch-owned' : 'felt-patch'}`}>
                        <div className="flex items-center justify-between text-xs font-mono mb-2">
                          <span className="text-zinc-400">{monster.series} · {monster.rarity}</span>
                          <button
                            onClick={() => toggleOwned(monster.id)}
                            className={`px-2 py-0.5 rounded text-[11px] font-bold ${isOwned ? 'bg-[#39ff14] text-black' : 'bg-[#2d2645] text-zinc-300'}`}
                          >
                            {isOwned ? '✓ VAULTED' : '+ COLLECT'}
                          </button>
                        </div>

                        <div className="flex items-center justify-center py-2">
                          <MonsterAvatar monster={monster} size="md" interactive={true} />
                        </div>

                        <div className="mt-2 space-y-2">
                          <div>
                            <h3 className="text-lg font-black text-white flex items-center justify-between">
                              <span>{monster.name}</span>
                              <span className="text-xs font-mono text-[#ffe600]">{monster.teethCount} 🦷</span>
                            </h3>
                            <p className="text-xs italic text-zinc-400">{monster.species}</p>
                          </div>
                          <p className="text-xs bg-[#121118] p-2 rounded text-zinc-300">"{monster.mischiefTrait}"</p>
                        </div>

                        <div className="mt-4 pt-3 border-t border-[#4c3875]/40 grid grid-cols-2 gap-2 text-xs font-semibold">
                          <button onClick={() => { setSelectedMonster(monster); setActiveTab('clinic'); }} className="py-1.5 px-2 bg-[#2d2645] hover:bg-[#3d345c] text-cyan-300 rounded-lg text-center">
                            Inspect Teeth
                          </button>
                          <button onClick={() => { setSelectedMonster(monster); setMonsterAlias(monster.name); setActiveTab('adoption'); }} className="py-1.5 px-2 bg-[#ff007f]/20 hover:bg-[#ff007f]/30 text-[#ff007f] rounded-lg text-center">
                            Adoption Cert
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* MONSTER LAB ("BUILD-A-FUGGLER") */}
            {activeTab === 'lab' && (
              <div className="flex-1 overflow-y-auto custom-scrollbar px-4 sm:px-8 py-6 space-y-6">

            <button onClick={() => setActiveTab('guide')} className={`py-1 ${activeTab === 'guide' ? 'text-[#a855f7] font-bold' : 'text-zinc-400'}`}>Codex</button>
            <button onClick={() => setActiveTab('clinic')} className={`py-1 ${activeTab === 'clinic' ? 'text-cyan-400 font-bold' : 'text-zinc-400'}`}>Dentist</button>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
